[workspace]
resolver = "2"
members = [
    "crates/ceasta-binary",
    "crates/ceasta-disasm",
    "crates/ceasta-analysis",
    "crates/ceasta-decompiler",
    "crates/ceasta-debugger",
    "crates/ceasta-db",
    "crates/ceasta-script",
    "crates/ceasta-mcp",
    "crates/ceasta-host",
    "crates/ceasta-ui",
    "crates/ceasta-cli",
    "crates/ceasta-app",
]
default-members = ["crates/ceasta-cli"]

[workspace.package]
version = "0.13.0-rust"
edition = "2021"
license = "MIT"
repository = "https://github.com/progmatios23/ceasta-custom"
rust-version = "1.75"

[workspace.dependencies]
ceasta-binary = { path = "crates/ceasta-binary" }
ceasta-disasm = { path = "crates/ceasta-disasm" }
ceasta-analysis = { path = "crates/ceasta-analysis" }
ceasta-decompiler = { path = "crates/ceasta-decompiler" }
ceasta-debugger = { path = "crates/ceasta-debugger" }
ceasta-db = { path = "crates/ceasta-db" }
ceasta-script = { path = "crates/ceasta-script" }
ceasta-mcp = { path = "crates/ceasta-mcp" }
ceasta-host = { path = "crates/ceasta-host" }
ceasta-ui = { path = "crates/ceasta-ui" }

anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
goblin = "0.8"
iced-x86 = { version = "1.21", default-features = false, features = ["std", "decoder", "intel", "instr_info"] }
clap = { version = "=4.5.23", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
