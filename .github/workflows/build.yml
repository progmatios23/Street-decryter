name: build

# Cargo workspace at repo root. Legacy C++ under legacy/ is not built.
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "publish a release with this tag, like v0.13.0 (leave empty to only build)"
        required: false
        default: ""

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: linux - build + test + cli package
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: cache
        uses: Swatinem/rust-cache@v2

      - name: build
        run: cargo build --release -p ceasta-cli -p ceasta-app

      - name: test
        run: cargo test --workspace --release

      - name: package the command line tool
        run: |
          version=$(grep -m1 '^version = ' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          name=ceasta-cli-$version-linux-x64
          mkdir -p dist/$name
          cp target/release/ceasta-cli README.md LICENSE docs/CHANGELOG.md docs/THIRD_PARTY_NOTICES.md dist/$name/
          cp -r plugins dist/$name/
          tar -C dist -czf dist/$name.tar.gz $name
          ./target/release/ceasta-cli --version
          ./target/release/ceasta-cli protect $$ || true

      - uses: actions/upload-artifact@v4
        with:
          name: ceasta-linux
          path: dist/*.tar.gz

  windows:
    name: windows - build + test + zip
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: cache
        uses: Swatinem/rust-cache@v2

      - name: build
        run: cargo build --release -p ceasta-cli -p ceasta-app

      - name: test
        run: cargo test --workspace --release

      - name: package
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"' | Select-Object -First 1).Matches.Groups[1].Value
          if (-not $version) { $version = "0.0.0" }
          $name = "ceasta-cli-$version-windows-x64"
          New-Item -ItemType Directory -Force -Path "dist/$name" | Out-Null
          Copy-Item target/release/ceasta-cli.exe "dist/$name/"
          Copy-Item README.md, LICENSE, docs/CHANGELOG.md, docs/THIRD_PARTY_NOTICES.md "dist/$name/"
          Copy-Item -Recurse plugins "dist/$name/"
          Compress-Archive -Path "dist/$name" -DestinationPath "dist/$name.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: ceasta-windows
          path: dist/*.zip

  macos:
    name: macos - build + test + cli package
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: cache
        uses: Swatinem/rust-cache@v2

      - name: build
        run: cargo build --release -p ceasta-cli -p ceasta-app

      - name: test
        run: cargo test --workspace --release

      - name: smoke cli on system binaries
        run: |
          cli=target/release/ceasta-cli
          $cli --version
          $cli info /bin/ls | head -40
          test "$($cli funcs /bin/ls | wc -l | tr -d ' ')" -gt 10
          $cli protect $$ || true

      - name: package
        run: |
          version=$(grep -m1 '^version = ' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          name=ceasta-cli-$version-macos
          mkdir -p dist/$name
          cp target/release/ceasta-cli README.md LICENSE docs/CHANGELOG.md docs/THIRD_PARTY_NOTICES.md dist/$name/
          cp -r plugins dist/$name/
          tar -C dist -czf dist/$name.tar.gz $name

      - uses: actions/upload-artifact@v4
        with:
          name: ceasta-macos
          path: dist/*.tar.gz

  release:
    name: publish github release
    needs: [linux, windows, macos]
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.release_tag }}
        run: |
          tag="$INPUT_TAG"
          if [ -z "$tag" ]; then tag="$GITHUB_REF_NAME"; fi
          version="${tag#v}"
          (cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt)
          gh release create "$tag" dist/* --title "ceasta $version" --generate-notes --verify-tag || \
            gh release upload "$tag" dist/* --clobber
